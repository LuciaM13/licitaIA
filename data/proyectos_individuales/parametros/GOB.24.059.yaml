  - "Acometidas: 71 ud variante 'Acom Abto <=63 mm PE-80 dem/repos pavto' (424-473 EUR/ud); el catalogo LicitaIA usa acometida generico (precio infravalora). Diferencia atribuible a cobertura de catalogo."
  - "Pavimentacion cap 02 es minima (20.452 EUR de PEM total 145.500): solo afecciones puntuales y reposicion local. La obra principal es Relining sin levantar pavimento."
